[project]
name = "loan-rag-assistant"
version = "0.1.0"
description = "Permission-aware RAG over synthetic loan PDF files"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<3",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "faiss-cpu>=1.8",
    "sentence-transformers>=3.0",
    "pdfplumber>=0.11",
    "pypdf>=4.3",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17",
    "pyjwt[crypto]>=2.9",
    "slowapi>=0.1.9",
    "structlog>=24.4",
    "httpx>=0.27",
    "openai>=1.40",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "torch>=2.4",  # listed so Linux builds can take the CPU-only wheel (see tool.uv.sources)
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pip-audit>=2.7",
    "faker>=28.0",
    "reportlab>=4.2",
    "pillow>=10.4",
]

# CPU-only torch on Linux (Docker/CI): avoids ~3 GB of CUDA wheels. macOS uses PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
    "S101",  # assert is fine in tests
    "S311",  # non-crypto random is fine for synthetic data
    "S608",  # SQL built only from constants; values are always bound parameters
    "B008",  # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"eval/**" = ["S108"]
"eval/synth/generate_corpus.py" = ["E501"]  # template/data tables read better unwrapped

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "app.security.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
markers = [
    "slow: tests that ingest PDFs or load the embedding model",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
