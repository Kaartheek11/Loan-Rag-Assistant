name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: mypy (strict on app/security)
        run: uv run mypy app
      - name: permission-SQL check (T18)
        run: uv run python scripts/check_permission_sql.py

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: system packages (OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils
      - name: cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5
      - run: uv sync --frozen
      - name: tests (FakeAdapter + testcontainers Postgres)
        run: uv run pytest -q

  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - name: pip-audit
        run: |
          uv export --frozen --no-emit-project --format requirements-txt > /tmp/req.txt
          uv run pip-audit -r /tmp/req.txt --disable-pip

  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: eslint + prettier
        run: npm run lint && npm run format:check
      - name: tsc (strict)
        run: npm run typecheck
      - name: vitest + RTL + MSW
        run: npm test
      - name: npm audit (runtime deps, high and above)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: build API image
        run: docker build -f docker/Dockerfile --target api -t loanrag-api:ci .
      - name: build web image (frontend bundle + Caddy)
        run: docker build -f docker/Dockerfile --target web -t loanrag-web:ci .
